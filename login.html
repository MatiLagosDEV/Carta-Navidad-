<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#012e29">
<meta name="robots" content="noindex, nofollow">
<title>Panel admin — Navidad Con Corazón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="envoltorio" style="padding: 80px 0 100px;">
  <form class="login-box" id="formLogin">
    <h1>Panel admin</h1>
    <div id="mensajeLogin"></div>
    <input type="email" id="email" placeholder="Email" autocomplete="email" required>
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn btn-coral" type="submit">Ingresar</button>
    <p id="pistaDemo" class="oculto pista-demo">
      Modo demo: <b>demo@demo.com</b> / <b>demo123</b>
    </p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/datos.js"></script>
<script src="js/layout.js"></script>
<script src="js/login.js"></script>
</body>
</html>
